name: Move pr to done dependabot

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  move-pr-to-done-dependabot:
    permissions:
      repository-projects: write
    secrets:
      PROJECT_RW_TOKEN: ${{ secrets.PLACEKEY_GITHUB_PROJECT_RW_TOKEN }}
    uses: senzing-factory/build-resources/.github/workflows/move-pr-to-done-dependabot.yaml@4f064da7dfb3a9481a886fd5ed9cffa1c0abc946 # v4
    with:
      project: ${{ vars.PLACEKEY_PROJECT_PLACEKEY }}
