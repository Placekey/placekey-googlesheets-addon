name: Add labels standardized

on:
  issues:
    types:
      - opened
      - reopened

permissions: {}

jobs:
  add-issue-labels:
    permissions:
      issues: write
    secrets:
      MEMBERS: ${{ secrets.PLACEKEY_MEMBERS }}
      ORG_MEMBERSHIP_TOKEN: ${{ secrets.ORG_MEMBERSHIP_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.PLACEKEY_DEVOPS_SLACK_WEBHOOK_URL }}
    uses: senzing-factory/build-resources/.github/workflows/add-labels-to-issue.yaml@03a3f1eb8a021cefeb7db484cb63a56549a4c9d6 # 4.10.2
