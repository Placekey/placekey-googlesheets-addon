name: Add labels standardized

on:
  issues:
    types:
      - opened
      - reopened

permissions: {}

jobs:
  add-issue-labels:
    permissions:
      issues: write
    secrets:
      MEMBERS: ${{ secrets.PLACEKEY_MEMBERS }}
      ORG_MEMBERSHIP_TOKEN: ${{ secrets.ORG_MEMBERSHIP_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.PLACEKEY_DEVOPS_SLACK_WEBHOOK_URL }}
    uses: senzing-factory/build-resources/.github/workflows/add-labels-to-issue.yaml@35bd53b01ab78531dfc265f8b547fd9d218c67c7 # 4.10.3
