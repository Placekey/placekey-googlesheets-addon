name: Add labels standardized

on:
  issues:
    types:
      - opened
      - reopened

permissions: {}

jobs:
  add-issue-labels:
    permissions:
      issues: write
    secrets:
      MEMBERS: ${{ secrets.PLACEKEY_MEMBERS }}
      ORG_MEMBERSHIP_TOKEN: ${{ secrets.ORG_MEMBERSHIP_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
    uses: senzing-factory/build-resources/.github/workflows/add-labels-to-issue.yaml@8141494442be199945d6d119665da9712f37303c # v4
