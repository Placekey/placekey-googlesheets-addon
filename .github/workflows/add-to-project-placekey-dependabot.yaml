name: Add to project placekey dependabot

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  add-to-project-dependabot:
    permissions:
      repository-projects: write
    secrets:
      PROJECT_RW_TOKEN: ${{ secrets.PLACEKEY_GITHUB_PROJECT_RW_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.PLACEKEY_DEVOPS_SLACK_WEBHOOK_URL }}
    uses: senzing-factory/build-resources/.github/workflows/add-to-project-dependabot.yaml@03a3f1eb8a021cefeb7db484cb63a56549a4c9d6 # 4.10.2
    with:
      project: ${{ vars.PLACEKEY_PROJECT_PLACEKEY }}
