name: Add to project placekey dependabot

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  add-to-project-dependabot:
    permissions:
      repository-projects: write
    secrets:
      PROJECT_RW_TOKEN: ${{ secrets.PLACEKEY_GITHUB_PROJECT_RW_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.PLACEKEY_DEVOPS_SLACK_WEBHOOK_URL }}
    uses: senzing-factory/build-resources/.github/workflows/add-to-project-dependabot.yaml@35bd53b01ab78531dfc265f8b547fd9d218c67c7 # 4.10.3
    with:
      project: ${{ vars.PLACEKEY_PROJECT_PLACEKEY }}
