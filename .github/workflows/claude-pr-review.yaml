name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    uses: senzing-factory/build-resources/.github/workflows/claude-pull-request-review.yaml@4f064da7dfb3a9481a886fd5ed9cffa1c0abc946 # v4
    permissions:
      contents: read
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
